<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>Maç Analiz</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2322c55e'/%3E%3Cpath d='M8 22h4v-6H8zM14 22h4V11h-4zM20 22h4V7h-4z' fill='%230d1220'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" class="logo" aria-hidden="true">
      <rect width="32" height="32" rx="9" fill="#22c55e"/>
      <path d="M8 22h4v-6H8zM14 22h4V11h-4zM20 22h4V7h-4z" fill="#0d1220"/>
    </svg>
    <div>
      <div class="title">Maç Analiz</div>
      <div class="sub"><span id="sub">yükleniyor…</span> <span id="livecount" class="livecount hidden"></span></div>
    </div>
  </div>
  <button class="icon-btn" id="refresh" aria-label="Yenile">
    <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</header>

<div id="banner" class="banner hidden"></div>

<main id="view"></main>

<nav class="tabs" id="tabs">
  <button data-tab="secim" class="on"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.6-4.6 4.1 1.3 6L12 16.9 6.6 19.3l1.3-6L3.3 9.2l6.1-.6z"/></svg><span>Seçimler</span></button>
  <button data-tab="bulten"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span>Bülten</span></button>
  <button data-tab="canli"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M6.3 6.3a8 8 0 0 0 0 11.4M17.7 6.3a8 8 0 0 1 0 11.4M8.8 8.8a4.5 4.5 0 0 0 0 6.4M15.2 8.8a4.5 4.5 0 0 1 0 6.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Canlı</span><b id="lcount" class="badge live hidden">0</b></button>
  <button data-tab="fav"><svg viewBox="0 0 24 24"><path d="M12 3.5l2.5 5.3 5.8.6-4.3 3.9 1.2 5.7L12 16.1 6.8 19l1.2-5.7L3.7 9.4l5.8-.6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>Favoriler</span><b id="fcount" class="badge hidden">0</b></button>
  <button data-tab="kupon"><svg viewBox="0 0 24 24"><path d="M5 4h14v5a3 3 0 0 0 0 6v5H5v-5a3 3 0 0 0 0-6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>Kupon</span><b id="kcount" class="badge hidden">0</b></button>
</nav>

<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
